<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>استبيان مهاب جمال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: landing = three grade cards; wizard = side stepper (right, RTL) + one question column, progress bar on top */
:root{
  --bg:#ffffff; --bg-soft:#f6f8fc; --fg:#141a2b; --muted:#6b7488; --faint:#a3abbd; --line:#e6e9f1;
  --brand:#00A0CC; --blue:#007fa3; --blue-soft:#e3f5fa;
  --green:#b5601a; --green-soft:#fdf0e1; --orange:#F09838;
  --amber:#8e2a14; --amber-soft:#f8e9e5;
  --danger:#d0453b;
  --card:#ffffff;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131c; --bg-soft:#141a26; --fg:#eef1f7; --muted:#9aa3b6; --faint:#667089; --line:#252d3d;
  --brand:#1db4dd; --blue:#4fc8ea; --blue-soft:#0f2a33; --green:#f5a85a; --green-soft:#33240f; --orange:#F09838; --amber:#ef8f76; --amber-soft:#341a14;
  --danger:#ff7a6f; --card:#151b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131c; --bg-soft:#141a26; --fg:#eef1f7; --muted:#9aa3b6; --faint:#667089; --line:#252d3d;
  --brand:#1db4dd; --blue:#4fc8ea; --blue-soft:#0f2a33; --green:#f5a85a; --green-soft:#33240f; --orange:#F09838; --amber:#ef8f76; --amber-soft:#341a14;
  --danger:#ff7a6f; --card:#151b27; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
.app{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.brand{display:flex;align-items:center;background:none;border:0;cursor:pointer;padding:0}
.brand img{height:54px;width:auto;display:block}
.nova{height:30px;width:auto;display:block}
.nova.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nova.lt{display:none}:root:not([data-theme="light"]) .nova.dk{display:block}}
:root[data-theme="dark"] .nova.lt{display:none}:root[data-theme="dark"] .nova.dk{display:block}

/* Landing */
.hero{background:linear-gradient(180deg,var(--bg-soft),var(--bg) 70%)}
.hero .wrap{padding-block:40px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;max-width:940px}
.hero .txt{padding-bottom:48px;text-align:right}
.hero .txt .lead{margin-right:0}
.hero .kicker{display:inline-block;background:var(--green-soft);color:var(--green);font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.char{height:330px;width:auto;display:block;max-width:100%}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1.25;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--brand)}
.lead{color:var(--muted);font-size:17px;margin:14px auto 0;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:24px 48px;max-width:940px;margin:0 auto}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;text-align:right;transition:box-shadow .2s,transform .2s}
.gcard:hover{box-shadow:0 14px 36px -18px rgba(30,50,90,.25);transform:translateY(-2px)}
.gcard .row{display:flex;justify-content:space-between;align-items:flex-start}
.gcard .num{color:var(--faint);font-size:14px;font-variant-numeric:tabular-nums}
.ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center}
.gcard h2{font-family:var(--display);font-size:23px;margin:10px 0 0;line-height:1.3}
.gcard .en{color:var(--muted);font-size:14px;direction:ltr;text-align:right;font-family:system-ui,sans-serif}
.gcard p{margin:0;color:var(--muted);min-height:3.4em}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:12px;padding:16px 18px;font:600 17px var(--display);cursor:pointer;width:100%}
.go svg{transition:transform .2s}
.go:hover svg{transform:translate(-3px,-3px)}
.tone-blue .ico,.tone-blue .go{background:var(--blue-soft);color:var(--blue)}
.tone-green .ico,.tone-green .go{background:var(--green-soft);color:var(--green)}
.tone-amber .ico,.tone-amber .go{background:var(--amber-soft);color:var(--amber)}
.how{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding-bottom:56px}
.how b{color:var(--fg);font-weight:600}
.how span{display:flex;gap:8px;align-items:center}
.how i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:600}

/* Wizard */
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:28px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--brand));border-radius:4px;transition:width .35s ease}
.wiz{display:grid;grid-template-columns:270px minmax(0,1fr);gap:64px;padding-block:28px 64px}
aside.side{position:sticky;top:20px;align-self:start}
.side .eyebrow{color:var(--blue);font-size:13px;font-weight:600}
.side h2{font-family:var(--display);font-size:26px;margin:6px 0 0;line-height:1.3}
.side .en{color:var(--muted);font-size:13px;font-family:system-ui,sans-serif}
.back{background:none;border:0;color:var(--muted);font:500 13px var(--body);cursor:pointer;padding:0;margin-bottom:22px;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--blue)}
ol.steps{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.steps li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:default}
ol.steps li.done{cursor:pointer}
ol.steps li.on{background:var(--blue-soft)}
.dotn{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--faint);font-size:14px;font-variant-numeric:tabular-nums}
li.on .dotn{background:var(--brand);border-color:var(--brand);color:#fff}
li.done .dotn{border-color:var(--blue);color:var(--blue)}
.st b{display:block;font-size:15px;font-weight:600;color:var(--muted);line-height:1.3}
.st small{font-size:12px;color:var(--faint)}
li.on .st b{color:var(--blue)}
li.done .st b{color:var(--fg)}

main.pane{max-width:720px;min-width:0}
.pane .eyebrow{color:var(--blue);font-size:13px;font-weight:600}
.pane h3{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);margin:6px 0 0;line-height:1.3;text-wrap:balance}
.pane .intro{color:var(--muted);margin:8px 0 0}
.qs{display:flex;flex-direction:column;gap:38px;margin-top:40px}
.q{display:flex;flex-direction:column;gap:6px}
.q .lab{display:flex;align-items:baseline;gap:10px;font-weight:600;font-size:17px}
.q .lab .n{color:var(--faint);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;min-width:18px}
.q .lab .req{color:var(--blue);font-size:12px}
.q .hint{color:var(--muted);font-size:14px;padding-right:28px}
.q .ctl{margin-top:10px}
input.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:15px 16px;font:15px var(--body);transition:border-color .15s,box-shadow .15s}
textarea.t{min-height:110px;resize:vertical;line-height:1.7}
input.t::placeholder,textarea.t::placeholder{color:var(--faint)}
input.t:focus,textarea.t:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--blue-soft)}
input[type=tel].t{direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 18px;font:500 15px var(--body);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.chip .box{width:16px;height:16px;border-radius:5px;border:1.5px solid currentColor;opacity:.5;display:grid;place-items:center}
.chip.radio .box{border-radius:50%}
.chip[aria-pressed="true"] .box{opacity:1;background:var(--brand);border-color:var(--brand)}
.chip[aria-pressed="true"] .box::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.scale button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:12px 6px;cursor:pointer;font:600 20px var(--display);display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button small{font:500 12px var(--body);color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.scale button[aria-pressed="true"] small{color:#fff;opacity:.85}
.err{color:var(--danger);font-size:13px;min-height:0}
.q.bad input.t,.q.bad textarea.t{border-color:var(--danger)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:15px 28px;font:600 16px var(--display);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Review */
.rev{display:flex;flex-direction:column;gap:22px;margin-top:36px}
.rev section{border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.rev .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rev .rh b{font-family:var(--display);font-size:17px}
.rev .rh button{background:none;border:0;color:var(--blue);font:500 13px var(--body);cursor:pointer}
.rev dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 18px;margin:0}
.rev dt{color:var(--muted);font-size:14px}
.rev dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Done */
.done-box{max-width:560px;margin:0 auto;text-align:center;padding-block:96px}
.done-box .ok{width:84px;height:84px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 24px}
.done-box h3{font-family:var(--display);font-size:30px;margin:0}
.done-box p{color:var(--muted)}
.preview-note{display:inline-block;margin-top:10px;font-size:13px;background:var(--amber-soft);color:var(--amber);padding:6px 14px;border-radius:999px}

footer{border-top:1px solid var(--line);color:var(--faint);font-size:13px}
footer .wrap{padding-block:22px;text-align:center}

@media (max-width:900px){
  .cards{grid-template-columns:minmax(0,1fr);gap:14px;max-width:520px}
  .wiz{grid-template-columns:minmax(0,1fr);gap:24px}
  aside.side{position:static}
  ol.steps{flex-direction:row;overflow-x:auto;gap:6px;margin-top:18px;padding-bottom:4px}
  ol.steps li{padding:8px 12px;gap:8px;flex:none}
  .st small{display:none}
  .dotn{width:28px;height:28px;font-size:13px}
  .hero .wrap{padding-block:24px 0;gap:8px;max-width:520px}
  .hero .txt{padding-bottom:22px}
  .char{height:210px}
  .lead{font-size:15px}
  .gcard{padding:24px}
}
@media (max-width:480px){
  .char{height:170px}
  .brand img{height:42px}
  .nova{height:22px}
  .scale button small{display:none}
  .rev dl{grid-template-columns:minmax(0,1fr)}
  .rev dd{margin-bottom:6px}
  .nav .btn{padding:14px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" dir="rtl" lang="ar" id="app"></div>

<script>
/* ====== اعدادات — غيّر دول بس ====== */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzKKLs_mGmL2W6b2oAditdVIkTiuUPytF8kf7f1p5j5HvB6JH0cAeg32fynth_xW4s/exec"                  // رابط Google Apps Script (Web app URL). لو فاضي الفورم بيشتغل معاينة بس
};
/* =================================== */

document.documentElement.lang = "ar";
document.documentElement.dir = "rtl";

const GRADES = {
  g2:  {title:"تانية ثانوي عام", en:"2nd Secondary · General", desc:"لطلاب تانية ثانوي، عام أو أزهر.", tone:"blue",
        icon:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>'},
  bac: {title:"تانية بكالوريا", en:"2nd Secondary · Baccalaureate", desc:"لطلاب البكالوريا، مسار الطب وعلوم الحياة.", tone:"green",
        icon:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 18 9 5 9-5" opacity=".5"/>'},
  g3:  {title:"تالتة ثانوي", en:"3rd Secondary", desc:"لطلاب تالتة ثانوي، علمي رياضة أو علوم أو أزهر.", tone:"amber",
        icon:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 9v6"/>'}
};

const TRACK = {
  g2:  {label:"عام ولا أزهر؟", options:["عام","أزهر"]},
  bac: {label:"مسارك إيه؟", options:["الطب وعلوم الحياة"]},
  g3:  {label:"شعبتك إيه؟", options:["علمي رياضة","علمي علوم","أزهر"]}
};

const STEPS = [
  {id:"info", title:"بياناتك", sub:"نتعرّف عليك", heading:"خلّينا نتعرّف عليك",
   intro:"كل البيانات هنا اختيارية، وتقدر تجاوب وانت مجهول.",
   qs:[
    {id:"track", type:"single", req:true, show:()=>state.grade!=="bac", label:g=>TRACK[g].label, options:g=>TRACK[g].options},
    {id:"name", type:"text", label:"اسمك؟", hint:"اختياري. لو حابب تفضل مجهول سيبها فاضية", ph:"اكتب اسمك أو سيبها فاضية"},
    {id:"phone", type:"tel", label:"رقم الواتساب؟", hint:"اختياري. لو حابب نتواصل معاك", ph:"01xxxxxxxxx"},
    {id:"school", type:"text", label:"منطقتك؟", hint:"اختياري. عشان نعرف أنسب مكان ليك", ph:"مثال: حي ..."}
   ]},
  {id:"time", title:"جدولك", sub:"دروسك وأيامك", heading:"جدولك شكله إيه؟",
   intro:"عشان نختار المعاد اللي يناسب أغلب الطلاب ومايتلخبطش مع باقي دروسك.",
   qs:[
    {id:"lessons", type:"single", req:true, label:"بتاخد كام درس في الأسبوع؟", hint:"في كل المواد مع بعض", options:["1 – 3","4 – 5","6 – 7","8 أو أكتر"]},
    {id:"midweek", type:"single", req:true, label:"عندك يومين فاضيين في نص الأسبوع؟", options:["أيوه، عندي يومين","يوم واحد بس","لأ، الأسبوع مليان"]},
    {id:"days", type:"multi", label:"أنهي أيام فاضية؟", hint:"اختار كل الأيام اللي تنفع", show:a=>a.midweek && a.midweek!=="لأ، الأسبوع مليان",
     options:["السبت","الأحد","الاتنين","التلات","الأربع","الخميس"]},
    {id:"friday", type:"single", req:true, label:"بتخرج يوم الجمعة؟", hint:"عشان نعرف ينفع نعمل مراجعة أو امتحان يوم الجمعة", options:["لأ، فاضي","أيوه، بخرج","أحيانًا"]},
    {id:"slot", type:"single", label:"أنسب وقت ليك؟", options:["الصبح","الضهر","بعد العصر","بالليل"]}
   ]},
  {id:"physics", title:"الفيزيا", sub:"إيه اللي تاعبك", heading:"الفيزيا معاك عاملة إزاي؟",
   intro:"اختار كل اللي ينطبق عليك، مفيش إجابة غلط.",
   qs:[
    {id:"level", type:"scale", req:true, label:"تقيّم مستواك في الفيزيا كام من 5؟"},
    {id:"issues", type:"multi", req:true, label:"إيه مشكلتك في الفيزيا؟", hint:"ممكن تختار أكتر من حاجة",
     options:["صعبة","طويلة","مش بعرف أختار القانون المناسب","غلطات تافهة في الغالب","بنسى اللي ذاكرته","مأخدتش درس فيها قبل كده",
              "مش بفهم المسألة من الكلام","الرسم البياني والدواير","الحسابات وتحويل الوحدات","وقت الامتحان مش بيكفي"]},
    {id:"hardest", type:"text", label:"أكتر جزء أو درس حاسس إنه تقيل؟", ph:"مثال: قوانين الحركة، الدواير الكهربية..."},
    {id:"physicsMore", type:"textarea", label:"حاجة تانية حابب تقولها عن الفيزيا؟", ph:"اكتب براحتك"}
   ]},
  {id:"center", title:"مشاكلك", sub:"اللي بيقابلك", heading:"إيه اللي بيقابلك ومضايقك؟",
   intro:"رأيك بيفرق معانا في ترتيب كل حاجة من أول يوم.",
   qs:[
    {id:"centerIssues", type:"multi", req:true, label:"إيه المشاكل اللي بتقابلك عمومًا؟", hint:"ممكن تختار أكتر من حاجة",
     options:["المدرس نفسه","التيم والمساعدين","الدعم العلمي وحل الأسئلة","الزحمة وعدد الطلاب","المواعيد","المسافة والمواصلات","المتابعة مع ولي الأمر","الامتحانات والتصحيح","مفيش مشاكل"]},
    {id:"centerMore", type:"textarea", label:"في حاجة معينة مضايقاك أو عايزنا نغيّرها؟", hint:"اكتب براحتك، الكلام ده بيوصل للمدرس بس", ph:"مثال: الحصة بتتأخر، الشرح سريع، مفيش حد أسأله بعد الحصة..."},
    {id:"wish", type:"textarea", label:"إيه أهم حاجة تحب تلاقيها معانا؟", ph:"مثال: امتحانات كل أسبوع، حد يرد على أسئلتي بسرعة..."},
    {id:"source", type:"single", label:"عرفتنا منين؟", options:["فيسبوك","صاحب أو قريب","المدرسة","السنتر","غير كده"]}
   ]},
  {id:"review", title:"المراجعة", sub:"خطوة أخيرة", heading:"راجع إجاباتك", intro:"اتأكد إن كل حاجة مظبوطة، وبعدين ابعت."}
];
const SCALE = ["ضعيف","محتاج شغل","متوسط","كويس","ممتاز"];

let state = {view:"home", grade:null, step:0, maxStep:0, a:{}};
const DRAFT = "physics-survey-draft";

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = (v, g) => typeof v === "function" ? v(g) : v;
const visible = q => !q.show || q.show(state.a);
const arrow = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17 7 7"/><path d="M7 15V7h8"/></svg>';

function header(){
  return `<header class="top"><div class="wrap">
    <button class="brand" id="home" type="button" aria-label="الصفحة الرئيسية"><img src="${IMG.mahab}" alt="مهاب جمال"></button>
    <span><img class="nova lt" src="${IMG.novaB}" alt="NOVA for Physics"><img class="nova dk" src="${IMG.novaW}" alt="NOVA for Physics"></span>
  </div></header>`;
}
const footer = () => `<footer><div class="wrap">NOVA for Physics · إجاباتك بتوصل للمدرس بس، وبتساعدنا نرتب المجموعات على مقاسك.</div></footer>`;

function renderHome(){
  const cards = Object.entries(GRADES).map(([k,g],i)=>`
    <article class="gcard tone-${g.tone}">
      <div class="row"><span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${g.icon}</svg></span>
      <span class="num">0${i+1}</span></div>
      <h2>${g.title}</h2>
      <div class="en">${g.en}</div>
      <p>${g.desc}</p>
      <button class="go" type="button" data-grade="${k}"><span>${state.grade===k && Object.keys(state.a).length ? "كمّل من مكانك" : "ابدأ دلوقتي"}</span>${arrow}</button>
    </article>`).join("");
  $app.innerHTML = header() + `
    <section class="hero"><div class="wrap">
      <div class="txt"><span class="kicker">بياخد حوالي 3 دقايق</span>
      <h1>انت في <em>سنة كام؟</em></h1>
      <p class="lead">اختار سنتك، وجاوب على كام سؤال صغيرين عن جدولك والفيزيا معاك عاملة إزاي.</p></div>
      <img class="char" src="${IMG.char}" alt="" width="454" height="840">
    </div></section>
    <div class="wrap"><div class="cards">${cards}</div>
      <div class="how"><span><i>١</i><b>اختار سنتك</b></span><span><i>٢</i><b>جاوب على الأسئلة</b></span><span><i>٣</i><b>ابعت إجاباتك</b></span></div>
    </div>` + footer();
  $app.querySelectorAll("[data-grade]").forEach(b=>b.onclick=()=>{
    const g = b.dataset.grade;
    if(state.grade!==g){ state.a = {}; state.maxStep = 0; }
    state.grade = g; state.step = 0; state.view = "wiz"; save(); render(); scrollTo(0,0);
  });
  bindHome();
}
function bindHome(){ const h=document.getElementById("home"); if(h) h.onclick=()=>{state.view="home";render();}; }

function ctlHTML(q){
  const v = state.a[q.id], g = state.grade;
  if(q.type==="text") return `<input class="t" id="f-${q.id}" type="text" placeholder="${esc(q.ph||"اكتب إجابتك هنا")}" value="${esc(v)}" autocomplete="off">`;
  if(q.type==="tel") return `<input class="t" id="f-${q.id}" type="tel" inputmode="numeric" maxlength="14" placeholder="${esc(q.ph)}" value="${esc(v)}">`;
  if(q.type==="textarea") return `<textarea class="t" id="f-${q.id}" placeholder="${esc(q.ph||"")}">${esc(v)}</textarea>`;
  if(q.type==="scale") return `<div class="scale" role="radiogroup">${SCALE.map((s,i)=>`<button type="button" id="f-${q.id}-${i}" data-q="${q.id}" data-v="${i+1}" aria-pressed="${v==i+1}">${i+1}<small>${s}</small></button>`).join("")}</div>`;
  const multi = q.type==="multi", opts = val(q.options,g);
  return `<div class="chips" role="${multi?"group":"radiogroup"}">${opts.map((o,i)=>{
    const on = multi ? (v||[]).includes(o) : v===o;
    return `<button type="button" class="chip ${multi?"":"radio"}" id="f-${q.id}-${i}" data-q="${q.id}" data-v="${esc(o)}" aria-pressed="${on}"><span class="box"></span>${esc(o)}</button>`;
  }).join("")}</div>`;
}

function sideHTML(){
  const G = GRADES[state.grade];
  return `<aside class="side">
    <button class="back" type="button" id="toHome"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg>غيّر السنة</button>
    <div class="eyebrow">استبيان الطلاب</div>
    <h2>${G.title}</h2><div class="en">${G.en}</div>
    <ol class="steps">${STEPS.map((s,i)=>`<li class="${i===state.step?"on":i<=state.maxStep?"done":""}" data-step="${i}"><span class="dotn">${i+1}</span><span class="st"><b>${s.title}</b><small>${s.sub}</small></span></li>`).join("")}</ol>
  </aside>`;
}

function renderWiz(){
  const S = STEPS[state.step], G = GRADES[state.grade], g = state.grade;
  const pct = Math.round((state.step+1)/STEPS.length*100);
  let body;
  if(S.id==="review"){
    body = `<div class="rev">${STEPS.slice(0,-1).map((s,si)=>`<section><div class="rh"><b>${s.title}</b><button type="button" data-step="${si}">تعديل</button></div><dl>${
      s.qs.filter(visible).map(q=>{ let v=state.a[q.id]; if(Array.isArray(v)) v=v.join("، "); if(q.type==="scale"&&v) v=`${v} من 5 (${SCALE[v-1]})`;
        return `<dt>${esc(val(q.label,g))}</dt><dd>${v?esc(v):'<span style="color:var(--faint)">—</span>'}</dd>`;}).join("")
    }</dl></section>`).join("")}</div>`;
  } else {
    let n=0;
    body = `<div class="qs">${S.qs.filter(visible).map(q=>{ n++; return `
      <div class="q" id="q-${q.id}">
        <div class="lab"><span class="n">${String(n).padStart(2,"0")}</span><span>${esc(val(q.label,g))}</span>${q.req?'<span class="req">•</span>':""}</div>
        ${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}
        <div class="ctl">${ctlHTML(q)}</div>
        <div class="err" id="e-${q.id}"></div>
      </div>`;}).join("")}</div>`;
  }
  const last = S.id==="review";
  $app.innerHTML = header() + `<div class="wrap">
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="wiz">${sideHTML()}
      <main class="pane">
        <div class="eyebrow">${G.title} · خطوة ${state.step+1} من ${STEPS.length}</div>
        <h3>${S.heading}</h3><p class="intro">${S.intro}</p>
        ${body}
        <div class="err" id="sendErr" style="margin-top:18px"></div>
        <div class="nav">
          ${state.step>0?`<button class="btn ghost" type="button" id="prev">السابق</button>`:"<span></span>"}
          <button class="btn primary" type="button" id="next">${last?"ابعت إجاباتي":"التالي"} ${arrowLeft()}</button>
        </div>
      </main></div></div>` + footer();
  bindWiz();
}
const arrowLeft = () => '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>';

function bindWiz(){
  bindHome();
  document.getElementById("toHome").onclick=()=>{state.view="home";render();scrollTo(0,0);};
  $app.querySelectorAll("li[data-step],.rh button[data-step]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.step; if(i<=state.maxStep){state.step=i;render();scrollTo(0,0);} });
  $app.querySelectorAll("input.t,textarea.t").forEach(el=>el.oninput=()=>{
    const id=el.id.slice(2); let v=el.value; if(el.type==="tel"){v=v.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d+]/g,""); if(v!==el.value) el.value=v;}
    state.a[id]=v; clearErr(id); save(); });
  $app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.q, q=findQ(id), v=b.dataset.v;
    if(q.type==="multi"){
      let arr=[...(state.a[id]||[])];
      if(arr.includes(v)) arr=arr.filter(x=>x!==v);
      else { if(v==="مفيش مشاكل") arr=[]; else arr=arr.filter(x=>x!=="مفيش مشاكل"); arr.push(v); }
      state.a[id]=arr;
    } else state.a[id] = q.type==="scale" ? +v : v;
    if(id==="midweek" && !visible(findQ("days"))) delete state.a.days;
    clearErr(id); save();
    const keep = scrollY; renderWiz(); scrollTo(0,keep);
    const f=document.getElementById(b.id); if(f) f.focus({preventScroll:true});
  });
  const prev=document.getElementById("prev"); if(prev) prev.onclick=()=>{state.step--;render();scrollTo(0,0);};
  document.getElementById("next").onclick=next;
}
function findQ(id){ for(const s of STEPS) for(const q of (s.qs||[])) if(q.id===id) return q; }
function clearErr(id){ const e=document.getElementById("e-"+id); if(e) e.textContent=""; const q=document.getElementById("q-"+id); if(q) q.classList.remove("bad"); }
const phoneOK = v => /^(01[0125]\d{8}|\+\d{9,13})$/.test(v||"");

function validate(){
  const S=STEPS[state.step]; let first=null;
  for(const q of S.qs.filter(visible)){
    const v=state.a[q.id]; let msg="";
    const empty = v==null || v==="" || (Array.isArray(v)&&!v.length);
    if(q.req && empty) msg = q.type==="multi"?"اختار حاجة واحدة على الأقل.":(q.type==="single"||q.type==="scale")?"اختار إجابة.":"الخانة دي مطلوبة.";
    else if(q.type==="tel" && !empty && !phoneOK(v)) msg="اكتب الرقم 11 رقم ويبدأ بـ 01، أو سيب الخانة فاضية.";
    if(msg){ document.getElementById("e-"+q.id).textContent=msg; document.getElementById("q-"+q.id).classList.add("bad"); first=first||q.id; }
  }
  if(first) document.getElementById("q-"+first).scrollIntoView({behavior:"smooth",block:"center"});
  return !first;
}

async function next(){
  if(STEPS[state.step].id!=="review"){
    if(!validate()) return;
    state.step++; state.maxStep=Math.max(state.maxStep,state.step); save(); render(); scrollTo(0,0); return;
  }
  const btn=document.getElementById("next"); btn.disabled=true; btn.firstChild.textContent="بنبعت... ";
  const g=state.grade, row={"وقت الإرسال":new Date().toLocaleString("en-GB",{timeZone:"Africa/Cairo"}), "السنة":GRADES[g].title};
  for(const s of STEPS.slice(0,-1)) for(const q of s.qs){
    let v = visible(q) ? state.a[q.id] : ""; if(Array.isArray(v)) v=v.join("، ");
    const key = q.id==="track" ? "المسار / الشعبة" : val(q.label,g).replace(/؟$/,"");
    row[key] = v ?? "";
  }
  if(g==="bac") row["المسار / الشعبة"]="الطب وعلوم الحياة";
  if(!state.a.name) row[val(findQ("name").label,g).replace(/؟$/,"")]="مجهول";
  let preview = !CONFIG.ENDPOINT;
  if(!preview){
    try{ await fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)}); }
    catch(e){ btn.disabled=false; btn.firstChild.textContent="ابعت إجاباتي ";
      document.getElementById("sendErr").textContent="الإرسال ما نجحش. اتأكد إن النت شغال وجرّب تاني."; return; }
  }
  try{ localStorage.removeItem(DRAFT); }catch(e){}
  const name=(state.a.name||"").split(" ")[0];
  state = {view:"done", grade:null, step:0, maxStep:0, a:{}, preview, name};
  render(); scrollTo(0,0);
}

function renderDone(){
  $app.innerHTML = header() + `<div class="wrap"><div class="done-box">
    <div class="ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></div>
    <h3>شكرًا${state.name?" يا "+esc(state.name):""}، إجاباتك وصلت</h3>
    <p>هنراجع كل الإجابات، رأيك يهمنا وهنشتغل عليه إن شاء الله.</p>
    ${state.preview?'<span class="preview-note">ده وضع المعاينة، الإجابة ما اتبعتتش لأي مكان</span>':""}
    <p style="margin-top:28px"><button class="btn ghost" type="button" id="again">إرسال استبيان جديد</button></p>
  </div></div>` + footer();
  bindHome(); document.getElementById("again").onclick=()=>{state.view="home";render();};
}

function render(){ ({home:renderHome, wiz:renderWiz, done:renderDone})[state.view](); }
render();
</script>
